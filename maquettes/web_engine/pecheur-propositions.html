<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cabane de pêcheur : propositions</title>
<link rel="stylesheet" href="../../lib/rendu/rendu.css">
<link rel="stylesheet" href="../../galerie/visionneuse.css">
<style>
  #etiquettes span { font-size: 12px; background: rgba(20, 26, 19, .8); max-width: 220px; white-space: normal; text-align: center; }
  #etiquettes span.titre { font-size: 14px; font-weight: 600; }
  .note { position: fixed; top: 54px; left: 8px; right: 8px; margin: 0; padding: 6px 10px; font-size: 13px; background: rgba(20, 26, 19, .7); border-radius: 8px; }
</style>
</head>
<body>
<canvas id="carte" aria-label="Cabane de pêcheur de web_royaumes : la cabane actuelle et trois propositions, au bord de l'eau"></canvas>
<div id="etiquettes"></div>
<div id="eclair"></div>
<form class="barre" id="choix">
  <b>Cabane de pêcheur : propositions</b>
  <label>Époque (cabane retenue) <select name="epoque"><option value="ancien">1700</option><option value="lumieres">1750</option><option value="empire">1789</option><option value="industrie">1816</option></select></label>
</form>
<p class="note">Validée le 19/11/2026 : un mélange de P1 et P3 (lib 2.18.0, colonne « Retenue ») ; sur une case de rivage, l'eau à droite (côté +x : le serveur tourne la cabane vers sa case d'eau).</p>
<p class="aide">Glisser : déplacer · clic droit ou Maj : tourner · molette : zoom</p>
<script type="module">
// Les propositions sont écrites dans les conventions des bâtiments de modeles.js (unités du modèle, une case de rayon 10,
// l'eau à +x, le sol à y = 0, la surface de l'eau vers y = −1,5), pour que celle qui sera retenue y passe telle quelle.
import { THREE, scene, cam, camera, apresCamera } from '../../lib/rendu/scene.js';
import { lot, put, fige, cyl, cone, boite, sphere, jeter } from '../../lib/rendu/toon.js';
import { maillageBatiment } from '../../lib/rendu/modeles.js';
import { appliquerMeteo, forcerHeure } from '../../lib/rendu/meteo.js';
import { climat } from '../../lib/rendu/vie.js';

const SQ3 = Math.sqrt(3), BOIS = 0x8b5a2b, BOIS_F = 0x5b3a1e, PLANCHE = 0xa87a4a, CHAUME = 0xc9a14f, MUR = 0xead7b0, PIERRE = 0x9c968a, FILET = 0x6a7a6a, EAU_Y = -1.5;
function prisme(L, w, d, h, col, x, y, z, ry = 0) {  // le toit à deux pans de modeles.js
  const p = cyl(1, 1, d, 3); p.rotateX(Math.PI / 2); p.rotateZ(Math.PI); p.scale(w / SQ3, h / 1.5, 1); p.translate(0, h / 2 - h / 3, 0);
  put(L, p, col, x, y + h / 6, z, ry, 0.26);
}
const barque = (L, x, y, z, ry = 0, retournee = false) => {  // une barque de pêche, à flot ou retournée sur la grève
  put(L, boite(3, 0.55, 1.2), 0x6b4a2b, x, y + (retournee ? 0.3 : 0.25), z, ry, 0.06);
  if (retournee) put(L, boite(2.6, 0.12, 1), 0x4f3520, x, y + 0.62, z, ry, 0);
  else { put(L, boite(2.4, 0.1, 0.9), PLANCHE, x, y + 0.5, z, ry, 0); put(L, boite(0.25, 0.1, 0.9), BOIS_F, x + 0.6 * Math.cos(ry), y + 0.6, z - 0.6 * Math.sin(ry), ry, 0); }
};
const tonneau = (L, x, z) => put(L, cyl(0.45, 0.45, 1, 10), 0x8a5a2b, x, 0.5, z, 0, 0.1);
const casier = (L, x, y, z) => { put(L, cyl(0.4, 0.45, 0.55, 8), 0x8a6a42, x, y + 0.28, z, 0, 0.06); put(L, cyl(0.42, 0.42, 0.06, 8), 0x5b3a1e, x, y + 0.58, z, 0, 0); };
const sechoir = (L, x, z, ry = 0, n = 6) => {  // perches et poissons qui sèchent
  const c = Math.cos(ry), s = Math.sin(ry);
  for (const k of [-1.2, 1.2]) put(L, boite(0.14, 2.2, 0.14), BOIS_F, x + k * c, 1.1, z - k * s, ry, 0);
  put(L, boite(2.6, 0.08, 0.08), BOIS, x, 2.1, z, ry, 0);
  for (let i = 0; i < n; i++) { const u = -1 + 2 * i / (n - 1); put(L, boite(0.12, 0.55, 0.22), 0xb9c4c8, x + u * 1.05 * c, 1.7, z - u * 1.05 * s, ry, 0.02); }
};
const filets = (L, x, z, ry = 0) => {  // un filet tendu entre deux perches
  const c = Math.cos(ry), s = Math.sin(ry);
  for (const k of [-1.5, 1.5]) put(L, boite(0.14, 2, 0.14), BOIS_F, x + k * c, 1, z - k * s, ry, 0);
  put(L, boite(3, 1.4, 0.04), FILET, x, 1.15, z, ry, 0); put(L, boite(3.1, 0.08, 0.08), 0xd9c9a0, x, 1.85, z, ry, 0);
};
const ponton = (L, x0, x1, z, larg = 1.4) => {  // plancher sur pilotis, qui dépasse le rivage (bord de la case vers 8,7)
  put(L, boite(x1 - x0, 0.3, larg), PLANCHE, (x0 + x1) / 2, 0.3, z, 0, 0.1);
  for (let x = x0 + 0.5; x <= x1; x += 2.4) for (const dz of [-larg / 2 + 0.1, larg / 2 - 0.1]) put(L, boite(0.28, 2.6, 0.28), BOIS_F, x, -0.9, z + dz, 0, 0);
};
const fumee = (L, x, y, z) => { put(L, boite(0.5, 1.4, 0.5), PIERRE, x, y + 0.7, z, 0, 0.05); };

const PROPOSITIONS = [
  { nom: 'Retenue (bibliothèque)', txt: 'mélange de P1 et P3, tel que dessiné par modeles.js : cabane sur pilotis, jetée en L et ses deux barques, criée, filets et séchoir', actuelle: true },
  { nom: 'P1 · Cabane sur pilotis', txt: 'la cabane posée sur pilotis au bord de l’eau, son ponton et sa barque ; filets et séchoir à poissons sur la grève', dessin(L) {
    for (const [x, z] of [[2.6, -1.6], [6, -1.6], [2.6, 1.8], [6, 1.8]]) put(L, boite(0.35, 2.6, 0.35), BOIS_F, x, 0, z, 0, 0);  // pilotis
    put(L, boite(4.6, 0.3, 4.4), PLANCHE, 4.3, 1.3, 0.1, 0, 0.08);  // plancher
    put(L, boite(3.6, 2, 3.4), 0x9a7448, 4.3, 2.45, 0, 0, 0.1); prisme(L, 4.4, 4, 1.8, CHAUME, 4.3, 3.45, 0);
    put(L, boite(0.7, 1.3, 0.08), BOIS_F, 3.6, 2.1, 1.72, 0, 0); put(L, boite(0.6, 0.5, 0.08), 0x3a4652, 5.2, 2.6, 1.72, 0, 0);
    // échelle d'accès au plancher
    for (let k = 0; k < 4; k++) put(L, boite(0.9, 0.1, 0.2), PLANCHE, 1.6, 0.3 + k * 0.35, 1.7 - k * 0.25, 0, 0);
    ponton(L, 6.4, 10.4, 0.2, 1.2); barque(L, 9.2, EAU_Y, 1.9, 0.12);
    filets(L, -2.6, 3.6, 0.3); sechoir(L, -3.4, -2.6, -0.4); casier(L, 0.4, 0, 3.4); casier(L, 1.2, 0, 3.9); casier(L, 0.8, 0.6, 3.6); tonneau(L, -0.6, -3.8);
  } },
  { nom: 'P2 · Maison et grève', txt: 'une petite maison de pêcheur à l’abri sur la terre, cheminée du fumoir, barque retournée sur la grève, filets, casiers, un ponton court', dessin(L) {
    put(L, boite(4, 2.3, 3), MUR, -2.6, 1.15, -1.8, 0.2, 0.1); prisme(L, 4.6, 3.6, 1.8, CHAUME, -2.6, 2.3, -1.8, 0.2);
    put(L, boite(0.8, 1.4, 0.08), BOIS_F, -2.4, 0.7, -0.25, 0.2, 0); put(L, boite(0.6, 0.6, 0.08), 0x3a4652, -3.8, 1.4, -0.5, 0.2, 0);
    fumee(L, -4.3, 2.3, -2.4); put(L, boite(2, 1.6, 1.8), 0x7a6a5a, -5.6, 0.8, 1.2, 0.2, 0.08); prisme(L, 2.3, 2.1, 0.9, 0x6b5a4a, -5.6, 1.6, 1.2, 0.2);  // fumoir
    barque(L, 2.2, 0, 3.6, -0.5, true); filets(L, 1.6, -4.6, 0.1); filets(L, -1.2, 4.8, -0.2);
    casier(L, 3.6, 0, -1.4); casier(L, 4.3, 0, -0.9); casier(L, 3.9, 0.55, -1.2); tonneau(L, -0.2, 2.2);
    ponton(L, 4.8, 10, 1.6, 1.2); barque(L, 9, EAU_Y, 0, -0.08);
  } },
  { nom: 'P3 · Petit port de pêche', txt: 'une jetée en L avec deux barques, l’étal de la criée sous son auvent, la cabane du pêcheur, caisses de poissons et casiers', dessin(L) {
    put(L, boite(3.4, 2, 2.8), 0x9a7448, -3.4, 1, -2.8, 0, 0.1); prisme(L, 3.9, 3.3, 1.5, 0xa8553a, -3.4, 2, -2.8, 0);
    put(L, boite(0.7, 1.3, 0.08), BOIS_F, -3, 0.65, -1.38, 0, 0);
    // la criée : étal et auvent rayé
    put(L, boite(3, 0.9, 1.2), PLANCHE, -1, 0.45, 2.6, 0, 0.06); for (const x of [-2.4, 0.4]) for (const z of [2, 3.2]) put(L, boite(0.12, 2.2, 0.12), BOIS_F, x, 1.1, z, 0, 0);
    for (let k = 0; k < 4; k++) put(L, boite(0.78, 0.08, 1.5), k % 2 ? 0xf2efe6 : 0x3f6f9a, -2.05 + k * 0.78, 2.25, 2.6, 0, 0.02);
    for (let k = 0; k < 5; k++) put(L, boite(0.4, 0.12, 0.2), 0xb9c4c8, -2.1 + k * 0.5, 0.96, 2.6, 0, 0.02);
    for (const [x, z] of [[1.4, 1.2], [2, 1.4], [1.7, 0.6]]) put(L, boite(0.6, 0.4, 0.5), 0x8a6a42, x, 0.2, z, 0.3, 0.04);
    casier(L, 1, 0, -2.6); casier(L, 1.7, 0, -2.2); tonneau(L, -0.4, -4);
    ponton(L, 4.2, 10.6, -0.6, 1.4); put(L, boite(1.4, 0.3, 4.4), PLANCHE, 9.9, 0.3, 1.6, 0, 0.1);  // jetée en L
    for (const z of [2.2, 3.4]) put(L, boite(0.28, 2.6, 0.28), BOIS_F, 9.9, -0.9, z, 0, 0);
    barque(L, 8, EAU_Y, 1.6, 0.05); barque(L, 8.6, EAU_Y, -2.4, -0.1);
  } },
];

// ---- la vitrine : une case de rivage par proposition (terre sablonneuse, l'eau côté +x)
const PAS = 2.3, groupe = new THREE.Group(), etiq = document.getElementById('etiquettes'), f = document.getElementById('choix');
let poses = [];
scene.add(groupe);
function afficher() {
  for (const o of [...groupe.children]) o.userData.cache ? groupe.remove(o) : jeter(o);
  etiq.textContent = ''; poses = [];
  PROPOSITIONS.forEach((pr, c) => {
    const x = c * PAS, T = lot();
    put(T, cyl(0.965, 1, 0.16, 6), 0xd9cfa0, 0, -0.08, 0, 0, 0);
    put(T, boite(1.3, 0.02, 2.2), 0x4f8fc0, 1.15, -0.15, 0, 0, 0);  // l'eau, au-delà du bord de la case
    fige(T, groupe).position.set(x, 0, 0);
    if (pr.actuelle) { const { mesh } = maillageBatiment({ cle: 'pecheur', epoque: f.epoque.value }); mesh.position.set(x, 0, 0); mesh.userData.cache = true; groupe.add(mesh); }
    else { const L = lot(); pr.dessin(L); const g = fige(L, groupe); g.scale.setScalar(0.1); g.position.set(x, 0, 0); }
    const el = document.createElement('span'); el.className = 'titre'; el.textContent = pr.nom; etiq.append(el); poses.push({ el, p: new THREE.Vector3(x, 0, -1.2) });
    const n = document.createElement('span'); n.textContent = pr.txt; etiq.append(n); poses.push({ el: n, p: new THREE.Vector3(x, 0, 1.35) });
  });
}
apresCamera(() => {
  const v = new THREE.Vector3();
  for (const { el, p } of poses) { v.copy(p).project(camera); el.hidden = v.z > 1; el.style.transform = `translate(${(v.x + 1) / 2 * innerWidth}px, ${(1 - v.y) / 2 * innerHeight}px) translate(-50%, -50%)`; }
});
appliquerMeteo({ genre: 'soleil', temperature: 20, pluie: 0, vent: 0.4, neige_sol: 0 }, 2);
climat.nuages = 0; forcerHeure('jour');
f.addEventListener('change', afficher); afficher();
Object.assign(cam, { l: 4 * PAS + 2, h: 4, x: 1.5 * PAS, z: 0, cible: 10.5, d: 10.5, lacet: 0, auto: false });
</script>
</body>
</html>
