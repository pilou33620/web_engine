name: vérification

# Toutes les pages de la galerie, la carte test et les maquettes, dans Chromium : échec à la moindre erreur JavaScript.
# La galerie et la carte test chargent lib/ : c'est le test de la bibliothèque graphique.
on: [push, pull_request]

permissions:
  contents: read

jobs:
  pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Scripts shell
        run: for f in outils/*.sh outils/jeu/*.sh; do bash -n "$f" || exit 1; done
      - name: Modules de la bibliothèque (syntaxe)
        run: for f in lib/royaumes/*.js lib/power/pont.js; do node --check "$f" || exit 1; done
      - name: Chromium
        run: npm i --no-save playwright && npx playwright install --with-deps chromium
      - name: Pages
        run: node outils/verifier.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: captures, path: outils/captures }
