name: bancs d'essai

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  essais:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # le moteur et le serveur : génération de carte, météo, règles, ordres, tours, campagne de dix ans, sauvegarde
      - name: Moteur et serveur (Rust)
        run: cargo test -p royaumes

      # l'interface : chaque module JavaScript doit au moins se lire
      - name: Interface (syntaxe)
        run: for f in $(find web/js -name '*.js'); do node --experimental-default-type=module --check "$f" || exit 1; done
